name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.10-bookworm
        env:
          POSTGRES_DB: etm_test
          POSTGRES_USER: etm
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etm -d etm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        env:
          ETM_DOMAIN: classes.example.com
          ACME_EMAIL: ci@example.com
          POSTGRES_PASSWORD: ci-postgres-password
          ETM_API_SECRET: ci-api-secret-at-least-32-characters
          ALLOWED_CIDRS: 127.0.0.1/32
        run: |
          mkdir -p secrets
          touch secrets/youtube_cookies
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.local.yml config --quiet

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate database migrations
        env:
          DATABASE_URL: postgresql://etm:ci-postgres-password@127.0.0.1:5432/etm_test
        run: npm run db:migrate

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Audit production dependencies
        run: npm audit --omit=dev
